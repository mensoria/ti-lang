<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ti Lang：面向 Mensoria 的声明式业务语言。语言标准、语法与审批示例。">
  <title>Ti Lang 文档</title>
  <script>
    (() => {
      let language = 'zh-CN';
      try {
        const saved = localStorage.getItem('ti-language');
        if (saved === 'en' || saved === 'zh-CN') language = saved;
      } catch { /* Reading must work when storage is unavailable. */ }
      location.replace(new URL(language + '/index.html', location.href));
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=zh-CN/index.html"></noscript>
</head>
<body><p><a href="zh-CN/index.html">进入 Ti Lang 文档</a></p></body>
</html>
