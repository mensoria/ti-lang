[package]
name = "ti-lang"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Ti declarative business language validator and pure evaluator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "ti"
path = "src/main.rs"

[features]
default = []
mensoria-host = ["dep:surrealdb", "dep:tokio"]
host-qualification = ["mensoria-host"]

[dependencies.surrealdb]
version = "=3.3.0"
default-features = false
features = ["protocol-http", "rustls"]
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "sync", "time"]
optional = true
