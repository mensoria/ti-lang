[package]
name = "ti-lang"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Ti declarative business language validator and pure evaluator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "ti"
path = "src/main.rs"
